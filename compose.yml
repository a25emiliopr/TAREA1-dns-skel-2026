services:

  mandalorian:
    build: dnsserver
    hostname: mandalorian
    volumes:
     - ./mandalorian/named.conf.options:/etc/bind/named.conf.options
    #  - ./mandalorian/named.conf.default-zones:/etc/bind/named.conf.default-zones
    networks:
      rededns:
        ipv4_address: 192.168.20.20
  darthvader:
    build: dnsserver
    hostname: darthvader
    # command: -g -4
    volumes:
      - ./darthvader/named.conf.options:/etc/bind/named.conf.options
      - ./darthvader/zonas/named.conf.local:/etc/bind/named.conf.local
      - ./darthvader/zonas/db.starwars.lan:/etc/bind/db.starwars.lan
      - ./darthvader/zonas:/var/cache/bind
      #- ./dnsserver/root.hints:/usr/share/dns/root.hints
      - ./darthvader/named.conf.default-zones:/etc/bind/named.conf.default-zones
      - ./darthvader/logs:/var/log/bind
    networks:
      rededns:
        ipv4_address: 192.168.20.10

  darthsidious:
    build: dnsserver
    hostname: darthsidious
    depends_on:
      - darthvader
    networks:
      rededns:
        ipv4_address: 192.168.20.11
    volumes:
      - ./darthsidious/named.conf.local:/etc/bind/named.conf.local
  cliente:
    build: cliente
    hostname: cliente1
    networks:
      rededns:
        ipv4_address: 192.168.20.110
    # volumes:
    #   - ./cliente/rndc.conf:/etc/bind/rndc.conf
    #   - ./cliente/chave.key:/etc/bind/chave.key
    #   - ./cliente/actualiza.txt:/etc/bind/actualiza.txt
    dns: 
    - 192.168.20.10
    - 192.168.20.11

networks:
  rededns:
    ipam:
      config:
        - subnet: 192.168.20.0/24


